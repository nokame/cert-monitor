<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surveillance des certificats HTTPS</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
    --primary: #2563eb; --primary-dark: #1d4ed8;
    --ok: #16a34a; --warning: #d97706; --critical: #dc2626; --expired: #7f1d1d; --error: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { background: #111827; color: #fff; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 20px; font-weight: 600; }
  header .actions { display: flex; gap: 10px; align-items: center; }
  .btn { border: none; border-radius: 6px; padding: 9px 16px; font-size: 14px; cursor: pointer; font-weight: 500; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: #374151; color: #fff; }
  .btn-secondary:hover { background: #4b5563; }
  .btn-ghost { background: transparent; color: #d1d5db; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat { background: var(--card); border-radius: 10px; padding: 16px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .stat .value { font-size: 28px; font-weight: 700; }
  .stat .label { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .card { background: var(--card); border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; color: var(--muted); padding: 12px 16px; border-bottom: 1px solid #e5e7eb; background: #fafafa; }
  td { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f9fafb; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; }
  .badge.ok { background: var(--ok); } .badge.warning { background: var(--warning); }
  .badge.critical { background: var(--critical); } .badge.expired { background: var(--expired); }
  .badge.error { background: var(--error); } .badge.pending { background: #9ca3af; }
  .badge.disabled { background: #d1d5db; color: #4b5563; }
  .row-actions { display: flex; gap: 6px; }
  .icon-btn { border: none; background: transparent; cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 4px; }
  .icon-btn:hover { background: #e5e7eb; }
  .muted { color: var(--muted); font-size: 13px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  dialog { border: none; border-radius: 12px; padding: 0; width: 420px; max-width: 92vw; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .modal-head { padding: 18px 22px; font-size: 17px; font-weight: 600; border-bottom: 1px solid #e5e7eb; }
  .modal-body { padding: 20px 22px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .field input[type=text], .field input[type=number] { width: 100%; padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  .field input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .checkbox { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .modal-foot { padding: 14px 22px 20px; display: flex; justify-content: flex-end; gap: 10px; }
  .error-msg { color: var(--critical); font-size: 13px; margin-bottom: 12px; display: none; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🔒 Surveillance des certificats HTTPS</h1>
  <div class="actions">
    <span class="muted" id="mail-status" style="color:#9ca3af;"></span>
    <button class="btn btn-secondary" id="btn-check-all">Vérifier tout</button>
    <button class="btn btn-primary" id="btn-add">+ Ajouter un site</button>
  </div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Site</th><th>Statut</th><th>Jours restants</th><th>Expiration</th><th>Dernière vérif.</th><th style="width:140px;">Actions</th>
        </tr>
      </thead>
      <tbody id="sites-body"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none;">Aucun site surveillé. Cliquez sur « Ajouter un site » pour commencer.</div>
  </div>
</main>

<dialog id="site-dialog">
  <form id="site-form" method="dialog">
    <div class="modal-head" id="dialog-title">Ajouter un site</div>
    <div class="modal-body">
      <div class="error-msg" id="form-error"></div>
      <input type="hidden" id="f-id">
      <div class="field">
        <label for="f-name">Nom</label>
        <input type="text" id="f-name" placeholder="Mon site" required>
      </div>
      <div class="field">
        <label for="f-host">Hôte (domaine)</label>
        <input type="text" id="f-host" placeholder="exemple.com" required>
      </div>
      <div class="field">
        <label for="f-port">Port</label>
        <input type="number" id="f-port" value="443" min="1" max="65535" required>
      </div>
      <div class="field checkbox">
        <input type="checkbox" id="f-enabled" checked>
        <label for="f-enabled" style="margin:0;">Surveillance active</label>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" id="btn-cancel" style="background:#e5e7eb;color:#374151;">Annuler</button>
      <button type="submit" class="btn btn-primary" id="btn-save">Enregistrer</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script>
const STATUS_LABELS = {
  ok: 'OK', warning: 'Attention', critical: 'Critique',
  expired: 'Expiré', error: 'Erreur', pending: 'En attente', disabled: 'Désactivé'
};
let sites = [];

async function api(url, options = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...options
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Erreur serveur');
  return data;
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function renderStats() {
  const active = sites.filter(s => s.enabled);
  const count = st => active.filter(s => s.last_status === st).length;
  const pending = active.filter(s => !s.last_status).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="value">${active.length}</div><div class="label">Sites surveillés</div></div>
    <div class="stat"><div class="value" style="color:var(--ok)">${count('ok')}</div><div class="label">OK</div></div>
    <div class="stat"><div class="value" style="color:var(--warning)">${count('warning')}</div><div class="label">⚠ Attention (≤ J-30)</div></div>
    <div class="stat"><div class="value" style="color:var(--critical)">${count('critical') + count('expired')}</div><div class="label">Critique / expiré</div></div>
    <div class="stat"><div class="value" style="color:var(--error)">${count('error') + pending}</div><div class="label">Erreurs / en attente</div></div>`;
}

function renderSites() {
  const tbody = document.getElementById('sites-body');
  const empty = document.getElementById('empty');
  tbody.innerHTML = '';
  empty.style.display = sites.length ? 'none' : 'block';
  for (const s of sites) {
    const status = s.enabled ? (s.last_status || 'pending') : 'disabled';
    const days = s.last_days_left;
    const daysCell = days === null || days === undefined
      ? '<span class="muted">—</span>'
      : `<b style="color:${colorFor(status)}">${days} j</b>`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><b>${esc(s.name)}</b><br><span class="muted">${esc(s.host)}:${s.port}</span></td>
      <td><span class="badge ${status}">${STATUS_LABELS[status] || status}</span></td>
      <td>${daysCell}</td>
      <td>${s.last_not_after ? esc(s.last_not_after) : '<span class="muted">—</span>'}</td>
      <td class="muted">${s.last_checked_at ? esc(s.last_checked_at) + ' UTC' : 'jamais'}</td>
      <td><div class="row-actions">
        <button class="icon-btn" title="Vérifier maintenant" onclick="checkSite(${s.id})">🔄</button>
        <button class="icon-btn" title="Modifier" onclick="openEdit(${s.id})">✏️</button>
        <button class="icon-btn" title="Supprimer" onclick="removeSite(${s.id}, '${esc(s.name).replace(/'/g, "\\'")}')">🗑️</button>
      </div></td>`;
    tbody.appendChild(tr);
  }
  renderStats();
}

function colorFor(status) {
  return { ok: 'var(--ok)', warning: 'var(--warning)', critical: 'var(--critical)',
           expired: 'var(--expired)', error: 'var(--error)' }[status] || 'var(--muted)';
}

async function load() {
  try {
    [sites, cfg] = await Promise.all([api('/api/sites'), api('/api/config')]);
    document.getElementById('mail-status').textContent = cfg.mail_configured
      ? '✉ Notifications e-mail activées' : '✉ E-mail non configuré (voir .env)';
    renderSites();
  } catch (e) {
    toast('Impossible de charger les sites : ' + e.message);
  }
}

const dialog = document.getElementById('site-dialog');
const form = document.getElementById('site-form');

function openAdd() {
  form.reset();
  document.getElementById('f-id').value = '';
  document.getElementById('f-port').value = 443;
  document.getElementById('f-enabled').checked = true;
  document.getElementById('dialog-title').textContent = 'Ajouter un site';
  hideError();
  dialog.showModal();
}

function openEdit(id) {
  const s = sites.find(x => x.id === id);
  if (!s) return;
  document.getElementById('f-id').value = s.id;
  document.getElementById('f-name').value = s.name;
  document.getElementById('f-host').value = s.host;
  document.getElementById('f-port').value = s.port;
  document.getElementById('f-enabled').checked = !!s.enabled;
  document.getElementById('dialog-title').textContent = 'Modifier le site';
  hideError();
  dialog.showModal();
}

function showError(msg) {
  const el = document.getElementById('form-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('form-error').style.display = 'none';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('f-id').value;
  const payload = {
    name: document.getElementById('f-name').value.trim(),
    host: document.getElementById('f-host').value.trim(),
    port: parseInt(document.getElementById('f-port').value, 10),
    enabled: document.getElementById('f-enabled').checked
  };
  try {
    if (id) {
      await api(`/api/sites/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
      toast('Site modifié.');
    } else {
      await api('/api/sites', { method: 'POST', body: JSON.stringify(payload) });
      toast('Site ajouté.');
    }
    dialog.close();
    await load();
  } catch (err) {
    showError(err.message);
  }
});

document.getElementById('btn-add').addEventListener('click', openAdd);
document.getElementById('btn-cancel').addEventListener('click', () => dialog.close());

async function removeSite(id, name) {
  if (!confirm(`Supprimer « ${name} » de la surveillance ?`)) return;
  try {
    await api(`/api/sites/${id}`, { method: 'DELETE' });
    toast('Site supprimé.');
    await load();
  } catch (e) {
    toast(e.message);
  }
}

async function checkSite(id) {
  toast('Vérification en cours…');
  try {
    await api(`/api/sites/${id}/check`, { method: 'POST' });
    await load();
  } catch (e) {
    toast(e.message);
  }
}

document.getElementById('btn-check-all').addEventListener('click', async () => {
  toast('Vérification de tous les sites…');
  try {
    await api('/api/check-all', { method: 'POST' });
    await load();
    toast('Vérification terminée.');
  } catch (e) {
    toast(e.message);
  }
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
